# Data persistence (survives image rebuilds and `docker compose up/down`):
#   • SQLite: host path ./backend/instance → /home/appuser/app/instance (database.db)
#   • Uploads: named volume ep_files → /home/appuser/app/files (band photos, etc.)
# Never run `docker compose down -v` or `docker volume prune` without a backup.
# Use a stable clone path on the server and avoid renaming COMPOSE_PROJECT_NAME
# or you may get a new empty ep_files volume (uploads appear "gone").

services:
  api:
    container_name: ep-api
    build:
      context: ./backend/
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - 8081:5000
    env_file:
      - ./backend/.backend.env
    volumes:
      - ep_files:/home/appuser/app/files
      - ./backend/instance:/home/appuser/app/instance
      - ./backend/init_script.sh:/home/appuser/app/init_script.sh
  app:
    container_name: eclecticpickup-app
    restart: unless-stopped
    build:
      context: ./frontend/
      dockerfile: Dockerfile.frontend
    ports:
      - 3001:80
    depends_on:
      - api
volumes:
  ep_files:
